name: card_management
description: 卡牌资产（Card Collector）大厂级黑金管理应用
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  isar: 3.1.0+1
  isar_flutter_libs: 3.1.0+1
  path_provider: 2.1.6
  flutter_riverpod: 2.6.1
  http: ^1.2.0
  fl_chart: 0.68.0
  equatable: 2.1.0
  json_annotation: 4.12.0
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.0
  file_picker: ^11.0.2
  share_plus: ^12.0.2
  image: ^4.9.1
  cross_file: ^0.3.5+4
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.5.0
  url_launcher: ^6.3.0
  cached_network_image: ^3.4.1
  # 锁 8.x：10.x 依赖 win32 ^6，与 file_picker 11.x / share_plus 12.x 所需的
  # win32 ^5 系列冲突（file_picker 版本被根 build.gradle.kts 的 AGP-9 补丁绑定，
  # 不可升级）。8.x 的 PackageInfo.fromPlatform() API 与 10.x 完全一致，无代码改动。
  package_info_plus: ^8.1.0
  dio: ^5.11.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  drift: 2.34.3
  sqlite3_flutter_libs: 0.6.0+eol
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.2
  build_runner: ^2.15.1
  drift_dev: ^2.34.3
  # isar_generator: ^3.1.0  # omitted due to source_gen version conflict with drift_dev
flutter:
  uses-material-design: true
  assets:
    - assets/images/app_logo.png
